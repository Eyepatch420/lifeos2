name: digidaily
description: DigiDaily - a private, on-device daily utility app (reminders, planner, expenses, health, notes, memberships, bills, documents).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  intl: ^0.19.0
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  share_plus: ^11.0.0
  file_picker: ^10.3.4
  image_picker: ^1.2.3
  local_auth: ^3.0.2
  path_provider: ^2.1.5
  package_info_plus: ^8.3.1
  audioplayers: ^6.8.1
  google_mlkit_text_recognition: ^0.16.0
  url_launcher: ^6.3.2
  path_provider_android: 2.2.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B3B3C"
  adaptive_icon_foreground: "assets/app_icon.png"
